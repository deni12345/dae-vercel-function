basePath: /api
definitions:
  firestore.CollectionRef:
    properties:
      id:
        description: ID is the collection identifier.
        type: string
      parent:
        $ref: '#/definitions/firestore.DocumentRef'
        description: |-
          Parent is the document of which this collection is a part. It is
          nil for top-level collections.
      path:
        description: 'The full resource path of the collection: "projects/P/databases/D/documents..."'
        type: string
    type: object
  firestore.DocumentRef:
    properties:
      id:
        description: 'The ID of the document: the last component of the resource path.'
        type: string
      parent:
        $ref: '#/definitions/firestore.CollectionRef'
        description: The CollectionRef that this document is a part of. Never nil.
      path:
        description: |-
          The full resource path of the document. A document "doc-1" in collection
          "coll-1" would be: "projects/P/databases/D/documents/coll-1/doc-1".
        type: string
    type: object
  model.DocumentChange:
    properties:
      action:
        type: string
      sheet:
        $ref: '#/definitions/model.Sheet'
    type: object
  model.Menu:
    properties:
      menuItems:
        description: Embedded items, not references
        items:
          $ref: '#/definitions/model.MenuItem'
        type: array
      name:
        type: string
    type: object
  model.MenuItem:
    properties:
      available:
        type: boolean
      category:
        type: string
      itemID:
        type: string
      name:
        type: string
      price:
        description: float64 is more common for currency
        type: number
    type: object
  model.Sheet:
    properties:
      createdAt:
        type: string
      createdBy:
        $ref: '#/definitions/firestore.DocumentRef'
        description: Reference to the user who created the sheet
      endAt:
        description: End time for the sheet
        type: string
      id:
        description: Firestore ID, not stored in Firestore
        type: string
      menu:
        $ref: '#/definitions/model.Menu'
        description: Changed to match original design
      status:
        type: string
      title:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: liemtran1414@gmail.com
    name: Liem Tran
  description: Drink and Eat API that hosted on vercel as microservice.
  title: Drink and Eat vercel function API
  version: "1.0"
paths:
  /broadcast-sheet:
    get:
      consumes:
      - application/json
      description: Stream sheet changes using Server-Sent Events (SSE)
      parameters:
      - description: Sheet ID to observe
        in: query
        name: sheetID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Stream of sheet changes
          schema:
            $ref: '#/definitions/model.DocumentChange'
        "400":
          description: Bad Request - Missing or invalid sheetID
          schema:
            type: string
        "408":
          description: Request Timeout - Client cancelled the request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Broadcast sheet changes in real-time
      tags:
      - sheets
  /collections:
    get:
      consumes:
      - application/json
      description: Returns the number of collections in the Firestore database
      produces:
      - application/json
      responses:
        "200":
          description: Collections count response
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get Firestore collections count
      tags:
      - collections
  /health:
    get:
      consumes:
      - application/json
      description: Check if the application is running and healthy
      produces:
      - text/plain
      responses:
        "200":
          description: Everything is good
          schema:
            type: string
      summary: Health check endpoint
      tags:
      - health
swagger: "2.0"
